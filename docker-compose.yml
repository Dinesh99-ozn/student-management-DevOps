services:
  # PostgreSQL database shared by all backend services.
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-student_management}
    
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Auto-run schema then seed on first container start.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/1-schema.sql
      - ./database/seed.sql:/docker-entrypoint-initdb.d/2-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth-service:
    build: ./services/auth-service
    restart: unless-stopped
    environment:
      PORT: 4001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-student_management}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
    ports:
      - "4001:4001"
    depends_on:
      postgres:
        condition: service_healthy

  student-service:
    build: ./services/student-service
    restart: unless-stopped
    environment:
      PORT: 4002
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-student_management}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
    ports:
      - "4002:4002"
    depends_on:
      postgres:
        condition: service_healthy

  academic-service:
    build: ./services/academic-service
    restart: unless-stopped
    environment:
      PORT: 4003
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}
      DB_NAME: ${DB_NAME:-student_management}
      JWT_SECRET: ${JWT_SECRET:-change_this_secret_in_production}
    ports:
      - "4003:4003"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_AUTH_API_URL: http://localhost:4001/api
        VITE_STUDENT_API_URL: http://localhost:4002/api
        VITE_ACADEMIC_API_URL: http://localhost:4003/api
    restart: unless-stopped
    ports:
      - "3001:80"
    depends_on:
      - auth-service
      - student-service
      - academic-service

volumes:
  pgdata:
