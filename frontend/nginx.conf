server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Send React routes to index.html instead of returning Nginx 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Do not cache the main HTML file during development.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}